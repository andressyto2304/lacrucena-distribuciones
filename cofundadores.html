<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Co-fundadores en vivo</title>

<style>
body{
font-family:Arial;
background:#000;
color:#fff;
padding:20px;
}

h1{
text-align:center;
color:#00ff88;
}

.card{
background:#111;
border:1px solid #00ff88;
padding:15px;
margin:10px 0;
border-radius:10px;
}
</style>
</head>

<body>

<h1>💚 Co-fundadores en Vivo</h1>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const cofRef = ref(db, "cofundadores");

const list = document.getElementById("list");

onValue(cofRef, (snap)=>{

  list.innerHTML = "";

  snap.forEach(child=>{

    const d = child.val();

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <h3>${d.nombre} ${d.apellidos}</h3>
      <p>💰 ${d.monto} Bs</p>
      <p>🎟 ${d.codigo}</p>
      <p>📍 ${d.direccion}</p>
    `;

    list.prepend(div);
  });

});

</script>

</body>
</html>
