<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA CRUCEÑA DISTRIBUCIONES</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #000;
  margin: 0;
  padding: 20px;
  color: #fff;
}

.card {
  max-width: 650px;
  margin: auto;
  background: #111;
  padding: 30px;
  border-radius: 15px;
}

h1, h2, h3 {
  text-align: center;
}

p {
  text-align: center;
}

.goal {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 10px;
}

.live {
  background: #0d0d0d;
  border: 1px solid #00cc44;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.cofundador {
  padding: 8px;
  border-bottom: 1px solid #222;
  font-size: 14px;
}

.logo {
  width: 200px;
  display: block;
  margin: auto;
  border-radius: 15px;
  border: 2px solid #00cc44;
}

.button {
  display: block;
  margin-top: 15px;
  padding: 12px;
  background: #00cc44;
  color: white;
  text-align: center;
  border-radius: 10px;
  text-decoration: none;
}

/* DEBUG */
#debug{
  font-size:12px;
  color:#888;
  text-align:center;
  margin-top:10px;
}
</style>

</head>

<body>

<div class="card">

<img src="logo.png" class="logo">

<h1>LA CRUCEÑA DISTRIBUCIONES</h1>

<div class="live">
<p>📊 Donaciones: <span id="contadorDonaciones">0</span></p>
<p>🔥 Última donación: <span id="ultimaDonacion">--</span></p>
</div>

<div class="live">
<h3>👥 Últimos 15 cofundadores</h3>
<div id="listaCofundadores">Cargando...</div>
</div>

<div id="debug"></div>

<a href="etiquetas.html" class="button">🗳️ Ir a Votación</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const donacionesRef = ref(db, "donaciones");

onValue(donacionesRef, (snapshot) => {

  const data = snapshot.val();

  document.getElementById("debug").innerText =
    "RAW DATA: " + JSON.stringify(data);

  if (!data) {
    document.getElementById("contadorDonaciones").innerText = 0;
    document.getElementById("ultimaDonacion").innerText = "--";
    document.getElementById("listaCofundadores").innerHTML = "Sin datos aún";
    return;
  }

  // 🔥 convertir a array seguro
  const list = Object.entries(data).map(([id, val]) => ({
    id,
    nombre: val?.nombre || "Anónimo",
    monto: val?.monto || 0
  }));

  // contador
  document.getElementById("contadorDonaciones").innerText = list.length;

  // última donación real
  const last = list[list.length - 1];
  document.getElementById("ultimaDonacion").innerText =
    `${last.nombre} - ${last.monto} Bs`;

  // lista últimos 15
  const last15 = list.slice(-15).reverse();

  const cont = document.getElementById("listaCofundadores");
  cont.innerHTML = "";

  last15.forEach(d => {
    const div = document.createElement("div");
    div.className = "cofundador";
    div.innerHTML = `💚 <b>${d.nombre}</b> - ${d.monto} Bs`;
    cont.appendChild(div);
  });

});

</script>

</body>
</html>
