<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA CRUCEÑA DISTRIBUCIONES</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #000;
  margin: 0;
  padding: 20px;
  color: #fff;
}

.card {
  max-width: 650px;
  margin: auto;
  background: #111;
  padding: 30px;
  border-radius: 15px;
}

h1, h2, h3 {
  text-align: center;
}

p {
  line-height: 1.6;
  text-align: center;
}

.goal {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
}

progress {
  width: 100%;
  height: 25px;
}

.live {
  background: #0d0d0d;
  border: 1px solid #00cc44;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.cofundador {
  padding: 8px;
  border-bottom: 1px solid #222;
}

.button {
  display: block;
  margin-top: 15px;
  padding: 12px;
  background: #00cc44;
  color: white;
  text-align: center;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
}

/* ADMIN PANEL */
#adminPanel {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0a0a0a;
  z-index: 99999;
  padding: 20px;
  overflow-y: auto;
}

.admin-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}

.admin-card {
  background: #111;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #222;
}

.admin-title {
  color: #00cc44;
}

.close-btn {
  margin-top: 20px;
  width: 100%;
  padding: 10px;
  background: red;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="card">

<h1>🙌 LA CRUCEÑA DISTRIBUCIONES</h1>

<p>
Proyecto de fábrica de bebidas en Santa Cruz.
</p>

<div class="live">
<h3>📊 Progreso</h3>
<progress id="progressBar" value="0" max="100"></progress>
</div>

<div class="live">
<p>📦 Donaciones: <span id="contadorDonaciones">0</span></p>
<p>🔥 Último: <span id="ultimaDonacion">--</span></p>
</div>

<div class="live">
<h3>👥 Cofundadores</h3>
<div id="listaCofundadores">Cargando...</div>
</div>

<a href="etiquetas.html" class="button">🗳️ Votación de etiquetas</a>

<a href="https://wa.me/59175166467" class="button" style="background:#25D366;">
💬 WhatsApp
</a>

</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">

<h1>🔐 PANEL ADMIN PRO</h1>

<div class="admin-grid">

<div class="admin-card">
<h3 class="admin-title">💰 DONACIONES</h3>
<p>Total: <span id="a_total">0</span> Bs</p>
<p>Cantidad: <span id="a_count">0</span></p>
</div>

<div class="admin-card">
<h3 class="admin-title">🗳️ VOTOS</h3>
<pre id="a_votes">Cargando...</pre>
</div>

<div class="admin-card">
<h3 class="admin-title">🔥 ÚLTIMO COFUNDADOR</h3>
<p id="a_last">--</p>
</div>

</div>

<button onclick="exportExcel()" class="close-btn" style="background:#007bff;">
📊 Exportar Excel Cofundadores
</button>

<button onclick="document.getElementById('adminPanel').style.display='none'" class="close-btn">
Cerrar Panel
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

import * as XLSX from "https://cdn.sheetjs.com/xlsx-latest/package/xlsx.mjs";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const donacionesRef = ref(db, "donaciones");
const votosRef = ref(db, "votos");

const url = new URLSearchParams(window.location.search);

if(url.get("admin") === "CRUCENA2026"){
document.getElementById("adminPanel").style.display = "block";
}

let cacheData = {};

onValue(donacionesRef,(snap)=>{

const data = snap.val() || {};
cacheData = data;

let count = Object.keys(data).length;
let total = 0;
let last = "--";

Object.keys(data).forEach(k=>{
total += Number(data[k].monto || 0);
});

if(count>0){
let keys = Object.keys(data);
let lastItem = data[keys[keys.length-1]];
last = lastItem.nombre + " - " + lastItem.monto + " Bs";
}

document.getElementById("contadorDonaciones").innerText = count;
document.getElementById("ultimaDonacion").innerText = last;

if(url.get("admin") === "CRUCENA2026"){
document.getElementById("a_total").innerText = total;
document.getElementById("a_count").innerText = count;
document.getElementById("a_last").innerText = last;
}

});

onValue(votosRef,(snap)=>{

if(url.get("admin") === "CRUCENA2026"){
document.getElementById("a_votes").innerText =
JSON.stringify(snap.val()||{},null,2);
}

});

// EXPORT EXCEL
window.exportExcel = function(){

let rows = [];

Object.values(cacheData).forEach(d=>{
rows.push({
Nombre: d.nombre || "",
Monto: d.monto || 0,
Codigo: d.codigo || "SIN CODIGO"
});
});

const ws = XLSX.utils.json_to_sheet(rows);
const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "Cofundadores");

XLSX.writeFile(wb, "cofundadores.xlsx");

};

</script>

</body>
</html>
