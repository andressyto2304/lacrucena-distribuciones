<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA CRUCEÑA DISTRIBUCIONES</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<h1>🥤 LA CRUCEÑA DISTRIBUCIONES</h1>

<p>
Bienvenido, nosotros somos LA CRUCEÑA DISTRIBUCIONES y estamos reuniendo fondos para iniciar una pequeña fábrica de jugos y gaseosas en Santa Cruz de la Sierra con buena calidad y precios accesibles para toda nuestra gente.
</p>

<hr>

<h2>🎯 Progreso del proyecto</h2>

<progress id="barra" value="0" max="105000"></progress>
<p id="porcentaje">0%</p>

<br>

<button class="button" onclick="location.href='paquetes.html'">
📦 Ver paquetes
</button>

<button class="button" onclick="location.href='formulario.html?paquete=Libre&monto=0'">
💚 Donación libre
</button>

<button class="button" onclick="window.open('https://wa.me/59175166467')">
📲 Atención al cliente
</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://TU_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_PROJECT_ID.firebasestorage.app",
  messagingSenderId: "XXX",
  appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total");

onValue(totalRef, (snapshot) => {
    let total = snapshot.val() || 0;

    document.getElementById("barra").value = total;

    let porcentaje = (total / 105000) * 100;
    document.getElementById("porcentaje").innerText =
        porcentaje.toFixed(2) + "% completado";
});
</script>

</body>
</html>
