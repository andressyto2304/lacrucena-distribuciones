<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA CRUCEÑA DISTRIBUCIONES</title>

<style>
body{
  background:black;
  color:white;
  font-family: Arial;
  text-align:center;
}

.container{
  padding:20px;
}

.button{
  background:#00ff00;
  color:black;
  padding:12px;
  border:none;
  margin:5px;
  cursor:pointer;
  font-weight:bold;
}

progress{
  width:80%;
  height:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>🥤 LA CRUCEÑA DISTRIBUCIONES</h1>

<p>
Estamos reuniendo fondos para iniciar nuestra fábrica de jugos y gaseosas en Santa Cruz de la Sierra.
</p>

<h2>🎯 Progreso del proyecto</h2>

<progress id="barra" value="0" max="105000"></progress>
<p id="porcentaje">0%</p>

<br>

<button class="button" onclick="location.href='paquetes.html'">
📦 Ver paquetes
</button>

<button class="button" onclick="location.href='formulario.html?paquete=Libre&monto=0'">
💚 Donación libre
</button>

</div>

<script>
/* 🔥 VERSION SEGURA SIN FIREBASE (para evitar pantalla en blanco) */

let total = 0;

// simulación inicial para probar que NO está en blanco
function actualizar(){
  let porcentaje = (total / 105000) * 100;

  document.getElementById("barra").value = total;
  document.getElementById("porcentaje").innerText =
    porcentaje.toFixed(2) + "%";
}

actualizar();
</script>

</body>
</html>
