<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
});

const db = firebase.database();
const storage = firebase.storage();

const totalRef = db.ref("total");
const fundadoresRef = db.ref("fundadores");

// BOTÓN
document.getElementById("sendBtn").onclick = async function () {

let nombre = document.getElementById("n").value || "No registrado";
let whatsapp = document.getElementById("w").value || "";
let direccion = document.getElementById("d").value || "";
let montoFinal = parseInt(document.getElementById("m").value);

if (!montoFinal || montoFinal <= 0) {
  alert("Ingresa un monto válido");
  return;
}

// archivo
let file = document.getElementById("comprobante").files[0];
let url = "";

// subir imagen
if (file) {
  let ref = storage.ref("comprobantes/" + Date.now() + "_" + file.name);
  await ref.put(file);
  url = await ref.getDownloadURL();
}

// guardar cofundador
await fundadoresRef.push({
  nombre,
  whatsapp,
  direccion,
  monto: montoFinal,
  comprobante: url,
  fecha: Date.now()
});

// sumar total
let snap = await totalRef.once("value");
let total = snap.val() || 0;
await totalRef.set(total + montoFinal);

// WHATSAPP
let msg =
`💚 Aporte recibido
Nombre: ${nombre}
Monto: ${montoFinal} Bs
Dirección: ${direccion}`;

window.location.href =
"https://wa.me/59175166467?text=" + encodeURIComponent(msg);

};
</script>
