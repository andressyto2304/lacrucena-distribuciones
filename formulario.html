<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario Co-fundadores</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<img src="logo.png" width="180">

<h1>📲 Rellena tus datos personales</h1>

<h2>📦 Detalle del paquete promocional elegido</h2>
<p id="detalle">Cargando...</p>

<hr>

<h2>🧾 Tus datos</h2>

<form id="f">

<input id="n" placeholder="Nombre" required><br><br>
<input id="ap1" placeholder="Primer apellido" required><br><br>
<input id="ap2" placeholder="Segundo apellido" required><br><br>

<input id="w" placeholder="WhatsApp" required><br><br>
<textarea id="d" placeholder="Dirección" required></textarea><br><br>

<input id="m" type="number" required><br><br>

<hr>

<h2>💳 Escanea para aportar</h2>

<img src="qr.png" width="200"><br><br>

<button type="button" class="button" onclick="descargarQR()">
⬇ Descargar QR
</button>

<hr>

<h2>📤 Comprobante</h2>

<p>
💚 Gracias por colaborar con nosotros.  
El envío del comprobante se realizará por WhatsApp al finalizar.
</p>

<hr>

<button type="button" id="sendBtn" class="button">
Enviar a WhatsApp
</button>

</form>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total");

// QR
window.descargarQR = function(){
  const a = document.createElement("a");
  a.href = "qr.png";
  a.download = "qr.png";
  a.click();
};

// DETALLE
const params = new URLSearchParams(window.location.search);
let montoURL = params.get("monto");

const detalle = document.getElementById("detalle");
const montoInput = document.getElementById("m");

let montoNum = Number(montoURL);

if (!montoURL || isNaN(montoNum) || montoNum === 0) {
  detalle.innerText = "💚 Gracias por tu aporte libre.";
  montoInput.placeholder = "Monto libre";
} else {
  montoInput.value = montoNum;
}

// GENERAR CÓDIGO CP
function generarCodigo(monto, nombre, ap1, ap2){

  const iniciales =
    (nombre[0] || "") +
    (ap1[0] || "") +
    (ap2[0] || "");

  const numero = Math.floor(Math.random() * 900 + 100);

  return `CP-${monto}-${iniciales.toUpperCase()}${numero}`;
}

// BOTÓN
document.getElementById("sendBtn").addEventListener("click", async (e)=>{
e.preventDefault();

let nombre = document.getElementById("n").value;
let ap1 = document.getElementById("ap1").value;
let ap2 = document.getElementById("ap2").value;
let whatsapp = document.getElementById("w").value;
let direccion = document.getElementById("d").value;
let montoFinal = parseInt(document.getElementById("m").value);

if(!montoFinal || montoFinal <= 0){
  alert("Ingresa un monto válido");
  return;
}

// Firebase total
let snap = await get(totalRef);
let total = snap.val() || 0;
await set(totalRef, total + montoFinal);

// código CP
let codigo = generarCodigo(montoFinal, nombre, ap1, ap2);

// mensaje WhatsApp
let msg =
`💚 Aporte recibido
Nombre: ${nombre} ${ap1} ${ap2}
Monto: ${montoFinal} Bs
Código co-fundador: ${codigo}
Dirección: ${direccion}
📌 Envía tu comprobante por este chat`;

// OVERLAY (MENSAJE ORIGINAL RESTAURADO)
const overlay = document.createElement("div");
overlay.style.position = "fixed";
overlay.style.top = "0";
overlay.style.left = "0";
overlay.style.width = "100%";
overlay.style.height = "100%";
overlay.style.background = "rgba(0,0,0,0.9)";
overlay.style.color = "#fff";
overlay.style.display = "flex";
overlay.style.alignItems = "center";
overlay.style.justifyContent = "center";
overlay.style.textAlign = "center";
overlay.style.padding = "20px";
overlay.style.zIndex = "9999";

overlay.innerHTML = `
<div>

<h2>💚 Gracias por decidir ser parte de nuestros co-fundadores</h2>

<p style="max-width:650px; line-height:1.6;">
Como último regalo en agradecimiento de parte de la familia de LA CRUCEÑA DISTRIBUIDORES te ofrecemos un descuento con entrega a domicilio del 10% en todos tus pedidos que realices durante 6 meses a partir del lanzamiento de la fábrica y producción.
</p>

<br>

<h1 style="color:#00ff88; font-size:32px; letter-spacing:2px;">
${codigo}
</h1>

<p style="margin-top:10px; font-weight:bold; color:#ffcc00;">
⚠ Este código es único y valida tu promoción  
No lo pierdas, sin él no podrás activar tus beneficios
</p>

<br>

<button id="aceptoBtn" style="
padding:12px 25px;
background:#28a745;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;">
✔ Acepto y continuar
</button>

</div>
`;

document.body.appendChild(overlay);

// REDIRIGIR SOLO AQUÍ
document.getElementById("aceptoBtn").onclick = function(){
  window.location.href =
  "https://wa.me/59175166467?text=" + encodeURIComponent(msg);
};

});

</script>

</body>
</html>
