<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar aporte</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<img src="logo.png" width="180">

<h1>📲 Finalizar aporte</h1>

<h2>📦 Detalle de tu aporte</h2>
<p id="detalle">Cargando...</p>

<hr>

<h2>🧾 Tus datos</h2>

<form id="f">

<input id="n" placeholder="Nombre" required><br><br>
<input id="w" placeholder="WhatsApp" required><br><br>
<textarea id="d" placeholder="Dirección" required></textarea><br><br>

<input id="m" type="number" required><br><br>

<hr>

<h2>💳 QR de pago</h2>
<img src="qr.png" width="200"><br><br>

<button type="button" class="button" onclick="descargarQR()">
⬇ Descargar QR
</button>

<hr>

<h2>📤 Subir comprobante</h2>
<input type="file" id="comprobante" accept="image/*"><br><br>

<hr>

<button id="sendBtn" class="button" disabled>
Enviar a WhatsApp
</button>

</form>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);

const totalRef = ref(db, "total");
const fundadoresRef = ref(db, "fundadores");

// --------------------
// DETALLE DE PAQUETE
// --------------------
const params = new URLSearchParams(window.location.search);
let montoURL = params.get("monto");

const detalle = document.getElementById("detalle");
const montoInput = document.getElementById("m");

let montoNum = Number(montoURL);

if (!montoURL || montoNum === 0 || isNaN(montoNum)) {

  detalle.innerText = "💚 Gracias por tu aporte libre, cualquier monto nos ayuda a crecer.";
  montoInput.placeholder = "Escribe tu aporte";

} else if (montoNum === 150) {

  detalle.innerText = "📦 Paquete Nº 1: 2 gaseosas de degustación. Recibe en tu domicilio o empresa.";
  montoInput.value = 150;

} else if (montoNum === 300) {

  detalle.innerText = "📦 Paquete Nº 2: 2 gaseosas + 1 jugo 3L. Recibe en tu domicilio o empresa.";
  montoInput.value = 300;

} else if (montoNum === 500) {

  detalle.innerText = "📦 Paquete Nº 3: 2 gaseosas + 2 jugos + gorra co-fundador. Recibe en tu domicilio o empresa.";
  montoInput.value = 500;

} else if (montoNum === 1000) {

  detalle.innerText = "📦 Paquete Nº 4: 3 gaseosas + 3 jugos + gorra + polera co-fundador. Recibe en tu domicilio o empresa.";
  montoInput.value = 1000;
}

// --------------------
// DESCARGAR QR
// --------------------
window.descargarQR = function(){
  const a = document.createElement("a");
  a.href = "qr.png";
  a.download = "qr.png";
  a.click();
};

// --------------------
// BOTÓN HABILITAR
// --------------------
const fileInput = document.getElementById("comprobante");
const sendBtn = document.getElementById("sendBtn");

fileInput.addEventListener("change", ()=>{
  if(fileInput.files.length > 0){
    sendBtn.disabled = false;
  }
});

// --------------------
// ENVIAR
// --------------------
sendBtn.addEventListener("click", async (e)=>{
e.preventDefault();

let nombre = document.getElementById("n").value || "No registrado";
let whatsapp = document.getElementById("w").value || "";
let direccion = document.getElementById("d").value || "";
let montoFinal = parseInt(document.getElementById("m").value);

if(!montoFinal || montoFinal <= 0){
  alert("Ingresa un monto válido");
  return;
}

// --------------------
// SUBIR COMPROBANTE
// --------------------
let file = fileInput.files[0];
let url = "";

if(file){
  let fileRef = sRef(storage, "comprobantes/" + Date.now() + "_" + file.name);
  await uploadBytes(fileRef, file);
  url = await getDownloadURL(fileRef);
}

// --------------------
// GUARDAR CO-FUNDADOR
// --------------------
await push(fundadoresRef, {
  nombre,
  whatsapp,
  direccion,
  monto: montoFinal,
  comprobante: url,
  fecha: Date.now()
});

// --------------------
// SUMAR TOTAL
// --------------------
let snap = await get(totalRef);
let total = snap.val() || 0;
await set(totalRef, total + montoFinal);

// --------------------
// WHATSAPP
// --------------------
let msg =
`💚 Aporte recibido
Nombre: ${nombre}
Monto: ${montoFinal} Bs
Dirección: ${direccion}

📎 Comprobante enviado al sistema`;

window.location.href =
"https://wa.me/59175166467?text=" + encodeURIComponent(msg);

});
</script>

</body>
</html>
