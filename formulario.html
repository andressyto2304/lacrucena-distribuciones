<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device=width, initial-scale=1.0">
<title>Formulario</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<img src="logo.png" width="180">

<h1>📲 Rellena tus datos personales</h1>

<h2>📦 Detalle del paquete promocional elegido</h2>
<p id="detalle">Cargando...</p>

<hr>

<h2>🧾 Tus datos</h2>

<form id="f">

<input id="n" placeholder="Nombre" required><br><br>
<input id="w" placeholder="WhatsApp" required><br><br>
<textarea id="d" placeholder="Dirección" required></textarea><br><br>

<input id="m" type="number" required><br><br>

<hr>

<h2>💳 Escanea para aportar</h2>

<img src="qr.png" width="200"><br><br>

<button type="button" class="button" onclick="descargarQR()">
⬇ Descargar QR
</button>

<hr>

<h2>📤 Comprobante</h2>

<p>
💚 Gracias por colaborar con nosotros.  
En el botón de abajo podrás enviarnos tu comprobante por WhatsApp.
</p>

<hr>

<button type="button" id="sendBtn" class="button">
Enviar a WhatsApp
</button>

</form>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total");

// QR download
window.descargarQR = function(){
  const a = document.createElement("a");
  a.href = "qr.png";
  a.download = "qr.png";
  a.click();
};

// DETALLE DE PAQUETES
const params = new URLSearchParams(window.location.search);
let montoURL = params.get("monto");

const detalle = document.getElementById("detalle");
const montoInput = document.getElementById("m");

let montoNum = Number(montoURL);

if (!montoURL || isNaN(montoNum) || montoNum === 0) {
  detalle.innerText = "💚 Gracias por tu aporte libre.";
  montoInput.placeholder = "Monto libre";
} else {
  montoInput.value = montoNum;
}

// BOTÓN WHATSAPP
document.getElementById("sendBtn").addEventListener("click", async (e)=>{
e.preventDefault();

let nombre = document.getElementById("n").value;
let whatsapp = document.getElementById("w").value;
let direccion = document.getElementById("d").value;
let montoFinal = parseInt(document.getElementById("m").value);

if(!montoFinal || montoFinal <= 0){
  alert("Ingresa un monto válido");
  return;
}

// sumar total
let snap = await get(totalRef);
let total = snap.val() || 0;
await set(totalRef, total + montoFinal);

// mensaje WhatsApp
let msg =
`💚 Aporte recibido
Nombre: ${nombre}
Monto: ${montoFinal} Bs
Dirección: ${direccion}
📌 Envía tu comprobante por este chat`;

window.location.href =
"https://wa.me/59175166467?text=" + encodeURIComponent(msg);

});

</script>

</body>
</html>
