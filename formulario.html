<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<h1>📋 Aporte</h1>

<form id="donationForm">

<label>Nombre</label>
<input type="text" id="nombre" required>

<label>WhatsApp</label>
<input type="text" id="whatsapp" required>

<label>Dirección</label>
<textarea id="direccion" required></textarea>

<label>Monto</label>
<input type="number" id="monto" required>

<button class="button" type="submit">Enviar</button>

</form>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total");

document.getElementById("donationForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const nombre = document.getElementById("nombre").value;
    const whatsapp = document.getElementById("whatsapp").value;
    const direccion = document.getElementById("direccion").value;
    const monto = parseInt(document.getElementById("monto").value);

    const snap = await get(totalRef);
    let actual = snap.val() || 0;
    let nuevo = actual + monto;

    await set(totalRef, nuevo);

    const mensaje =
`🙌 NUEVA DONACIÓN
👤 ${nombre}
📱 ${whatsapp}
🏠 ${direccion}
💰 ${monto} Bs`;

    window.location.href =
`https://wa.me/59175166467?text=${encodeURIComponent(mensaje)}`;
});
</script>

</body>
</html>
