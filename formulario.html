<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<h1>📋 Formulario de aporte</h1>

<form id="donationForm">

<label>Nombre</label>
<input type="text" id="nombre" required>

<label>WhatsApp</label>
<input type="text" id="whatsapp" required>

<label>Dirección</label>
<textarea id="direccion" required></textarea>

<label>Monto</label>
<input type="number" id="monto" required>

<h3>📸 Comprobante</h3>
<input type="file" required>

<button class="button" type="submit">
✅ Enviar
</button>

</form>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://TU_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_PROJECT_ID.firebasestorage.app",
  messagingSenderId: "XXX",
  appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total");

document.getElementById("donationForm").addEventListener("submit", function(e){
    e.preventDefault();

    const nombre = document.getElementById("nombre").value;
    const whatsapp = document.getElementById("whatsapp").value;
    const direccion = document.getElementById("direccion").value;
    const monto = parseInt(document.getElementById("monto").value);

    get(totalRef).then((snap) => {

        let actual = snap.val() || 0;
        let nuevo = actual + monto;

        set(totalRef, nuevo);

    });

    const mensaje =
`🙌 NUEVA DONACIÓN
👤 ${nombre}
📱 ${whatsapp}
🏠 ${direccion}
💰 ${monto} Bs`;

    window.location.href =
`https://wa.me/59175166467?text=${encodeURIComponent(mensaje)}`;

    setTimeout(() => {
        window.location.href = "gracias.html";
    }, 1500);

});
</script>

</body>
</html>
