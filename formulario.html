<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar aporte</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<img src="logo.png" width="180">

<h1>📲 Finalizar aporte</h1>

<!-- DETALLE -->
<h2>📦 Detalle de tu aporte</h2>
<p id="detalle">Cargando...</p>

<hr>

<!-- FORMULARIO -->
<h2>🧾 Tus datos</h2>

<form id="f">

<input id="n" placeholder="Nombre" required><br><br>
<input id="w" placeholder="WhatsApp" required><br><br>
<textarea id="d" placeholder="Dirección" required></textarea><br><br>
<input id="m" type="number" readonly><br><br>

<hr>

<!-- QR -->
<h2>💳 Escanea para aportar</h2>

<img src="qr.png" id="qrimg" width="200"><br><br>

<button type="button" class="button" onclick="descargarQR()">
⬇ Descargar QR
</button>

<hr>

<!-- COMPROBANTE -->
<h2>📤 Subir comprobante</h2>

<input type="file" id="comprobante" accept="image/*"><br><br>

<hr>

<!-- BOTÓN FINAL -->
<button id="sendBtn" class="button" disabled>
Enviar a WhatsApp
</button>

</form>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const totalRef = ref(db, "total");

// URL monto
const params = new URLSearchParams(window.location.search);
let monto = params.get("monto") || 0;

document.getElementById("m").value = monto;

// DETALLE DINÁMICO
const detalle = document.getElementById("detalle");

if (monto == 0) {
  detalle.innerText = "💚 Gracias por tu aporte libre, cualquier monto nos ayuda a crecer.";
} else if (monto == 150) {
  detalle.innerText = "📦 Paquete Nº 1: 2 gaseosas de degustación. Recibe tu promoción en la puerta de tu domicilio o empresa.";
} else if (monto == 300) {
  detalle.innerText = "📦 Paquete Nº 2: 2 gaseosas + 1 jugo 3L. Recibe tu promoción en la puerta de tu domicilio o empresa.";
} else if (monto == 500) {
  detalle.innerText = "📦 Paquete Nº 3: 2 gaseosas + 2 jugos + gorra co-fundador. Recibe tu promoción en la puerta de tu domicilio o empresa.";
} else if (monto == 1000) {
  detalle.innerText = "📦 Paquete Nº 4: 3 gaseosas + 3 jugos + gorra + polera co-fundador. Recibe tu promoción en la puerta de tu domicilio o empresa.";
}

// DESCARGAR QR
window.descargarQR = function(){
  const link = document.createElement("a");
  link.href = "qr.png";
  link.download = "qr.png";
  link.click();
};

// ACTIVAR BOTÓN SOLO SI HAY COMPROBANTE
const fileInput = document.getElementById("comprobante");
const sendBtn = document.getElementById("sendBtn");

fileInput.addEventListener("change", function(){
  if(fileInput.files.length > 0){
    sendBtn.disabled = false;
  }
});

// ENVIAR
document.getElementById("f").onsubmit = async (e)=>{
e.preventDefault();

let nombre = document.getElementById("n").value;
let whatsapp = document.getElementById("w").value;
let direccion = document.getElementById("d").value;
let montoFinal = parseInt(document.getElementById("m").value);

let snap = await get(totalRef);
let total = snap.val() || 0;

await set(totalRef, total + montoFinal);

let msg =
`Aporte:%0ANombre: ${nombre}%0AMonto: ${montoFinal} Bs%0ADirección: ${direccion}`;

window.location.href =
"https://wa.me/59175166467?text=" + encodeURIComponent(msg);
};

// botón manual (porque submit está controlado)
sendBtn.onclick = function(){
document.getElementById("f").requestSubmit();
};
</script>

</body>
</html>
