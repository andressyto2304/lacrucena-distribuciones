<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formulario - LA CRUCEÑA DISTRIBUCIONES</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container">

<h1>📋 Completa tus datos</h1>

<form id="donationForm">

<label>Nombre completo</label>
<input type="text" id="nombre" required>

<label>Número de WhatsApp</label>
<input type="text" id="whatsapp" required>

<label>Dirección</label>
<textarea id="direccion" required></textarea>

<label>Monto</label>
<input type="number" id="monto" required>

<h3 class="center">📲 Escanea el QR de pago</h3>

<div class="center">
<img src="qr.png" style="width:220px;border-radius:15px;border:2px solid #00cc44;">
</div>

<label>📸 Subir comprobante</label>
<input type="file" required>

<button type="submit" class="button">
✅ Enviar por WhatsApp
</button>

</form>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const paquete = params.get("paquete");
const montoURL = params.get("monto");

const montoInput = document.getElementById("monto");

// ===============================
// CONFIGURAR MONTO AUTOMÁTICO
// ===============================
if (montoURL !== null) {
    montoInput.value = montoURL;

    // si NO es donación libre, bloquear edición
    if (montoURL !== "0") {
        montoInput.readOnly = true;
    }
}

// ===============================
// ENVIAR FORMULARIO
// ===============================
document.getElementById("donationForm").addEventListener("submit", function(e){
    e.preventDefault();

    const nombre = document.getElementById("nombre").value;
    const whatsapp = document.getElementById("whatsapp").value;
    const direccion = document.getElementById("direccion").value;
    const montoFinal = montoInput.value;

    const mensaje =
`🙌 NUEVA DONACIÓN
📦 Paquete: ${paquete || "Donación Libre"}
👤 Nombre: ${nombre}
📱 WhatsApp: ${whatsapp}
🏠 Dirección: ${direccion}
💰 Monto: ${montoFinal} Bs`;

    const url = `https://wa.me/59175166467?text=${encodeURIComponent(mensaje)}`;

    // ===============================
    // PASO 1: abrir WhatsApp seguro
    // ===============================
    window.location.href = url;

    // ===============================
    // PASO 2: luego ir a gracias
    // ===============================
    setTimeout(() => {
        window.location.href = "gracias.html";
    }, 1500);

});

</script>

</body>
</html>
