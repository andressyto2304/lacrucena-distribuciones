<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Etiquetas</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<img src="logo.png" width="160">

<h1>🏷️ Votación de etiquetas</h1>

<p>Elige el diseño que más te guste 🙌</p>

<hr>

<h2>🥤 Gaseosas</h2>

<img src="gaseosa1.jpg" width="120"><br>
<button class="button" onclick="votar('g1')">Votar</button> <span id="g1">0</span>

<img src="gaseosa2.jpg" width="120"><br>
<button class="button" onclick="votar('g2')">Votar</button> <span id="g2">0</span>

<img src="gaseosa3.jpg" width="120"><br>
<button class="button" onclick="votar('g3')">Votar</button> <span id="g3">0</span>

<hr>

<h2>🧃 Jugos</h2>

<img src="jugo1.jpg" width="120"><br>
<button class="button" onclick="votar('j1')">Votar</button> <span id="j1">0</span>

<img src="jugo2.jpg" width="120"><br>
<button class="button" onclick="votar('j2')">Votar</button> <span id="j2">0</span>

<img src="jugo3.jpg" width="120"><br>
<button class="button" onclick="votar('j3')">Votar</button> <span id="j3">0</span>

<hr>

<button class="button" onclick="location.href='paquetes.html'">
➡ Continuar a paquetes
</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const votosRef = ref(db, "votos");

get(votosRef).then(snap=>{
  if(!snap.exists()){
    set(votosRef,{g1:0,g2:0,g3:0,j1:0,j2:0,j3:0});
  }
});

onValue(votosRef,(snap)=>{
  const d = snap.val();
  for(let k in d){
    document.getElementById(k).innerText = d[k];
  }
});

window.votar = async function(op){
  const snap = await get(votosRef);
  let d = snap.val();
  d[op]++;
  await set(votosRef,d);
};
</script>

</body>
</html>
