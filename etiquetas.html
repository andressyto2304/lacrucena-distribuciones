<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Votación de Etiquetas</title>

<style>
body{
background:#000;
color:#fff;
font-family:Arial;
padding:20px;
}

h1{
text-align:center;
color:#00ff88;
}

.card{
background:#111;
border:1px solid #00ff88;
padding:15px;
margin:10px 0;
border-radius:10px;
}

button{
padding:12px;
background:#00cc44;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
width:100%;
margin-top:10px;
font-size:16px;
}
</style>
</head>

<body>

<h1>🥤 Votación de Etiquetas</h1>

<div class="card">
<img src="gaseosa 1.png" width="100%">
<button onclick="votar('g1')">Votar Etiqueta 1</button>
<p>Votos: <span id="g1">0</span></p>
</div>

<div class="card">
<img src="gaseosa 2.jpg" width="100%">
<button onclick="votar('g2')">Votar Etiqueta 2</button>
<p>Votos: <span id="g2">0</span></p>
</div>

<div class="card">
<img src="gaseosa 3.png" width="100%">
<button onclick="votar('g3')">Votar Etiqueta 3</button>
<p>Votos: <span id="g3">0</span></p>
</div>

<h2 id="ganador">🏆 Cargando ganador...</h2>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const votosRef = ref(db, "votos");
const votersRef = ref(db, "votantes");

// 🧠 ID único del usuario (persistente)
let voterId = localStorage.getItem("voter_id");

if (!voterId) {
  voterId = "v_" + crypto.randomUUID();
  localStorage.setItem("voter_id", voterId);
}

// votos locales
let votos = {
  g1: 0,
  g2: 0,
  g3: 0
};

// 🔄 votos en tiempo real
onValue(votosRef, (snapshot)=>{

  const data = snapshot.val();

  if (data) {
    votos = {
      g1: Number(data.g1) || 0,
      g2: Number(data.g2) || 0,
      g3: Number(data.g3) || 0
    };
  }

  document.getElementById("g1").innerText = votos.g1;
  document.getElementById("g2").innerText = votos.g2;
  document.getElementById("g3").innerText = votos.g3;

  let ganador = "g1";
  if (votos.g2 > votos[ganador]) ganador = "g2";
  if (votos.g3 > votos[ganador]) ganador = "g3";

  document.getElementById("ganador").innerText =
    "🏆 Etiqueta líder: " + ganador.toUpperCase();
});

// 🗳 VOTAR CON BLOQUEO REAL EN FIREBASE
window.votar = async function(opcion){

  const snap = await get(votersRef);
  const data = snap.val() || {};

  // 🔒 BLOQUEO REAL
  if (data[voterId]) {
    alert("⚠ Ya has votado anteriormente");
    return;
  }

  // validar votos
  if (!votos[opcion] || isNaN(votos[opcion])) {
    votos[opcion] = 0;
  }

  votos[opcion] = Number(votos[opcion]) + 1;

  // guardar votos globales
  set(votosRef, votos);

  // registrar votante en Firebase
  await set(ref(db, "votantes/" + voterId), {
    voto: opcion,
    fecha: new Date().toISOString()
  });

  alert("💚 Gracias por votar. Ahora elige tu paquete promocional");

  setTimeout(() => {
    window.location.href = "paquetes.html";
  }, 800);
};

</script>

</body>
</html>
