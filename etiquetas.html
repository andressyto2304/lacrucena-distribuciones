<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votación de Etiquetas</title>

<style>
body{
font-family:Arial;
background:#000;
color:#fff;
padding:20px;
}

.card{
max-width:800px;
margin:auto;
background:#111;
padding:20px;
border-radius:15px;
}

.section{
margin-top:20px;
padding:15px;
border:1px solid #333;
border-radius:10px;
}

button{
padding:10px;
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
background:#00cc44;
color:white;
font-weight:bold;
cursor:pointer;
}

.voteBox{
margin-top:10px;
padding:10px;
background:#000;
border-radius:8px;
border:1px solid #333;
}
</style>

</head>

<body>

<div class="card">

<h1>🗳️ Votación de Etiquetas</h1>

<!-- GASEOSAS -->
<div class="section">
<h2>🥤 Gaseosas</h2>

<button onclick="vote('gaseosa','g1')">Gaseosa 1</button>
<div class="voteBox">Votos: <span id="g1v">0</span> | <span id="g1p">0</span>%</div>

<button onclick="vote('gaseosa','g2')">Gaseosa 2</button>
<div class="voteBox">Votos: <span id="g2v">0</span> | <span id="g2p">0</span>%</div>

<button onclick="vote('gaseosa','g3')">Gaseosa 3</button>
<div class="voteBox">Votos: <span id="g3v">0</span> | <span id="g3p">0</span>%</div>

</div>

<!-- JUGOS -->
<div class="section">
<h2>🧃 Jugos</h2>

<button onclick="vote('jugo','j1')">Jugo 1</button>
<div class="voteBox">Votos: <span id="j1v">0</span> | <span id="j1p">0</span>%</div>

<button onclick="vote('jugo','j2')">Jugo 2</button>
<div class="voteBox">Votos: <span id="j2v">0</span> | <span id="j2p">0</span>%</div>

<button onclick="vote('jugo','j3')">Jugo 3</button>
<div class="voteBox">Votos: <span id="j3v">0</span> | <span id="j3p">0</span>%</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const votosRef = ref(db,"votos");

// ID usuario
function getUserId(){
let id = localStorage.getItem("uid");
if(!id){
id = "U_" + Math.random().toString(36).substring(2,12);
localStorage.setItem("uid",id);
}
return id;
}

const uid = getUserId();

// render en vivo
onValue(votosRef,(snap)=>{
const v = snap.val() || {};

const g1=v.g1||0, g2=v.g2||0, g3=v.g3||0;
const j1=v.j1||0, j2=v.j2||0, j3=v.j3||0;

const totalG = g1+g2+g3;
const totalJ = j1+j2+j3;

// GASEOSAS
document.getElementById("g1v").innerText=g1;
document.getElementById("g2v").innerText=g2;
document.getElementById("g3v").innerText=g3;

document.getElementById("g1p").innerText= totalG?((g1/totalG)*100).toFixed(1):0;
document.getElementById("g2p").innerText= totalG?((g2/totalG)*100).toFixed(1):0;
document.getElementById("g3p").innerText= totalG?((g3/totalG)*100).toFixed(1):0;

// JUGOS
document.getElementById("j1v").innerText=j1;
document.getElementById("j2v").innerText=j2;
document.getElementById("j3v").innerText=j3;

document.getElementById("j1p").innerText= totalJ?((j1/totalJ)*100).toFixed(1):0;
document.getElementById("j2p").innerText= totalJ?((j2/totalJ)*100).toFixed(1):0;
document.getElementById("j3p").innerText= totalJ?((j3/totalJ)*100).toFixed(1):0;

});

// voto
window.vote = async function(categoria, opcion){

const userRef = ref(db,"usuarios/"+uid);
const snap = await get(userRef);
const data = snap.val() || {};

if(categoria==="gaseosa" && data.gaseosaVotado){
alert("Ya votaste gaseosas");
return;
}

if(categoria==="jugo" && data.jugoVotado){
alert("Ya votaste jugos");
return;
}

if(categoria==="gaseosa"){
await set(userRef,{...data,gaseosaVotado:true,gaseosa:opcion});
}

if(categoria==="jugo"){
await set(userRef,{...data,jugoVotado:true,jugo:opcion});
}

const votosSnap = await get(votosRef);
let votos = votosSnap.val()||{};

votos[opcion]=(votos[opcion]||0)+1;

await set(votosRef,votos);

};

</script>

</body>
</html>
