<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votación Segura</title>

<style>
body{
font-family:Arial;
background:#000;
color:#fff;
padding:20px;
}

.card{
max-width:800px;
margin:auto;
background:#111;
padding:20px;
border-radius:15px;
}

.section{
margin-top:20px;
padding:15px;
border:1px solid #333;
border-radius:10px;
}

button{
padding:10px;
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
background:#00cc44;
color:white;
font-weight:bold;
cursor:pointer;
}

.disabled{
background:#444 !important;
cursor:not-allowed;
}
</style>

</head>

<body>

<div class="card">

<h1>🗳️ Votación por Categorías</h1>

<!-- GASEOSAS -->
<div class="section">
<h2>🥤 Gaseosas (1 solo voto)</h2>

<button id="g1" onclick="vote('gaseosa','g1')">Gaseosa 1</button>
<button id="g2" onclick="vote('gaseosa','g2')">Gaseosa 2</button>
<button id="g3" onclick="vote('gaseosa','g3')">Gaseosa 3</button>

</div>

<!-- JUGOS -->
<div class="section">
<h2>🧃 Jugos (1 solo voto)</h2>

<button id="j1" onclick="vote('jugo','j1')">Jugo 1</button>
<button id="j2" onclick="vote('jugo','j2')">Jugo 2</button>
<button id="j3" onclick="vote('jugo','j3')">Jugo 3</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ID único
function getUserId(){
let id = localStorage.getItem("uid");
if(!id){
id = "U_" + Math.random().toString(36).substring(2,12);
localStorage.setItem("uid",id);
}
return id;
}

const uid = getUserId();

// VOTAR
window.vote = async function(categoria, opcion){

const userRef = ref(db,"usuarios/"+uid);
const snap = await get(userRef);
const data = snap.val() || {};

// BLOQUEO POR CATEGORÍA
if(categoria === "gaseosa" && data.gaseosaVotado){
alert("Ya votaste en gaseosas");
return;
}

if(categoria === "jugo" && data.jugoVotado){
alert("Ya votaste en jugos");
return;
}

// guardar usuario
if(categoria === "gaseosa"){
await set(userRef,{
...data,
gaseosaVotado:true,
gaseosa:opcion
});
}

if(categoria === "jugo"){
await set(userRef,{
...data,
jugoVotado:true,
jugo:opcion
});
}

alert("Voto registrado correctamente");

// bloquear botones
if(categoria === "gaseosa"){
document.querySelectorAll("[id^='g']").forEach(b=>{
b.disabled=true;
b.classList.add("disabled");
});
}

if(categoria === "jugo"){
document.querySelectorAll("[id^='j']").forEach(b=>{
b.disabled=true;
b.classList.add("disabled");
});
}

};

</script>

</body>

</html>
