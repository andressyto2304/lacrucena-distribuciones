<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votación de Etiquetas</title>

<style>
body{
font-family:Arial;
background:#000;
color:#fff;
padding:20px;
}

.card{
max-width:800px;
margin:auto;
background:#111;
padding:20px;
border-radius:15px;
}

.section{
margin-top:20px;
padding:15px;
border:1px solid #333;
border-radius:10px;
}

button{
padding:10px;
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
background:#00cc44;
color:white;
font-weight:bold;
cursor:pointer;
}

/* 🔥 IMAGEN PERFECTA SIN DEFORMAR */
img{
width:100%;
max-height:260px;
object-fit:contain;
background:#000;
border-radius:10px;
margin-top:10px;
}

/* barra opcional */
.progressBar{
height:8px;
background:#222;
border-radius:5px;
overflow:hidden;
margin-top:5px;
}

.progress{
height:100%;
background:#00cc44;
width:0%;
}

#nextBtn{
display:none;
margin-top:20px;
background:#007bff;
}
</style>

</head>

<body>

<div class="card">

<h1>🗳️ Votación de Etiquetas</h1>

<div class="section">
<h2>🥤 Gaseosas</h2>

<img src="gaseosa 1.png">
<button onclick="vote('gaseosa','g1')">Gaseosa 1</button>
<p>🔥 Votos: <span id="g1v">0</span></p>

<img src="gaseosa 2.jpg">
<button onclick="vote('gaseosa','g2')">Gaseosa 2</button>
<p>🔥 Votos: <span id="g2v">0</span></p>

<img src="gaseosa 3.png">
<button onclick="vote('gaseosa','g3')">Gaseosa 3</button>
<p>🔥 Votos: <span id="g3v">0</span></p>

</div>

<div class="section">
<h2>🧃 Jugos</h2>

<img src="jugo 1.png">
<button onclick="vote('jugo','j1')">Jugo 1</button>
<p>🔥 Votos: <span id="j1v">0</span></p>

<img src="jugo 2.png">
<button onclick="vote('jugo','j2')">Jugo 2</button>
<p>🔥 Votos: <span id="j2v">0</span></p>

<img src="jugo 3.png">
<button onclick="vote('jugo','j3')">Jugo 3</button>
<p>🔥 Votos: <span id="j3v">0</span></p>

</div>

<button id="nextBtn" onclick="goNext()">
➡ Ir a Paquetes Promocionales
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
get,
set,
onValue
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zC8C8C8",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const votosRef = ref(db,"votos");
const userRefBase = "usuarios/";

function getUserId(){

let id = localStorage.getItem("uid");

if(!id){

id = "U_" + Math.random().toString(36).substring(2,12);

localStorage.setItem("uid",id);

}

return id;

}

const uid = getUserId();

let gaseosaVoted = false;
let jugoVoted = false;

/* 🔥 MOSTRAR VOTOS EN TIEMPO REAL */
onValue(votosRef,(snapshot)=>{

const votos = snapshot.val() || {};

document.getElementById("g1v").innerText = votos.g1 || 0;
document.getElementById("g2v").innerText = votos.g2 || 0;
document.getElementById("g3v").innerText = votos.g3 || 0;

document.getElementById("j1v").innerText = votos.j1 || 0;
document.getElementById("j2v").innerText = votos.j2 || 0;
document.getElementById("j3v").innerText = votos.j3 || 0;

});

// 🔥 VOTAR CON BLOQUEO REAL
window.vote = async function(cat,opt){

const userRef = ref(db,userRefBase+uid);

const snap = await get(userRef);

const data = snap.val()||{};

// bloqueo real
if(cat==="gaseosa" && data.gaseosaVotado){

alert("Ya votaste gaseosas");

return;

}

if(cat==="jugo" && data.jugoVotado){

alert("Ya votaste jugos");

return;

}

// guardar usuario
if(cat==="gaseosa"){

await set(userRef,{...data,gaseosaVotado:true,gaseosa:opt});

gaseosaVoted = true;

}

if(cat==="jugo"){

await set(userRef,{...data,jugoVotado:true,jugo:opt});

jugoVoted = true;

}

// sumar votos
const snapVotes = await get(votosRef);

let votos = snapVotes.val()||{};

votos[opt]=(votos[opt]||0)+1;

await set(votosRef,votos);

/* 🔥 MENSAJE */
alert("💚 Gracias por votar por tu etiqueta favorita");

// validar avance real
checkFinish();

};

function checkFinish(){

const userRef = ref(db,userRefBase+uid);

get(userRef).then(snap=>{

const d = snap.val()||{};

if(d.gaseosaVotado && d.jugoVotado){

document.getElementById("nextBtn").style.display="block";

setTimeout(()=>{

window.location.href="paquetes.html";

},1500);

}

});

}

// fallback
window.goNext = function(){

window.location.href="paquetes.html";

};

</script>

<!-- BOTÓN DE NAVEGACIÓN A PAQUETES -->
<button onclick="window.location.href='paquetes.html'"
style="background:#007bff; width:100%; margin-top:20px; padding:10px; border:none; border-radius:8px; color:white; font-weight:bold; cursor:pointer;">
➡ Siguiente: Paquetes Promocionales
</button>
  
</body>
</html>
