<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votación de Etiquetas</title>

<style>
body{
font-family:Arial;
background:#000;
color:#fff;
padding:20px;
}

.card{
max-width:800px;
margin:auto;
background:#111;
padding:20px;
border-radius:15px;
}

.section{
margin-top:20px;
padding:15px;
border:1px solid #333;
border-radius:10px;
}

button{
padding:10px;
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
background:#00cc44;
color:white;
font-weight:bold;
cursor:pointer;
}

img{
width:100%;
border-radius:10px;
}

textarea{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
background:#000;
color:#fff;
border:1px solid #333;
}
</style>

</head>

<body>

<div class="card">

<h1>🗳️ Votación de Etiquetas</h1>

<!-- REGLAS -->
<div class="section">
<h3>📌 Reglas de votación</h3>
<p>
✔ Puedes votar 1 vez en <b>Gaseosas</b><br>
✔ Puedes votar 1 vez en <b>Jugos</b><br>
✔ Votos duplicados serán bloqueados automáticamente
</p>
</div>

<!-- GASEOSAS -->
<div class="section">
<h2>🥤 Gaseosas</h2>

<button onclick="vote('g1')">Gaseosa 1</button>
<button onclick="vote('g2')">Gaseosa 2</button>
<button onclick="vote('g3')">Gaseosa 3</button>

</div>

<!-- JUGOS -->
<div class="section">
<h2>🧃 Jugos</h2>

<button onclick="vote('j1')">Jugo 1</button>
<button onclick="vote('j2')">Jugo 2</button>
<button onclick="vote('j3')">Jugo 3</button>

</div>

<!-- COMENTARIOS -->
<div class="section">
<h2>💬 Comentarios de votantes</h2>

<textarea id="comment" placeholder="Escribe tu opinión o sugerencia..."></textarea>
<button onclick="sendComment()">Enviar comentario</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const usersRef = ref(db,"usuarios");
const votesRef = ref(db,"votos");
const commentsRef = ref(db,"comentarios");

// ID único
function getUserId(){
let id = localStorage.getItem("uid");
if(!id){
id = "U_" + Math.random().toString(36).substring(2,12);
localStorage.setItem("uid",id);
}
return id;
}

const uid = getUserId();

// ================= VOTAR =================
window.vote = async function(option){

const snap = await get(ref(db,"usuarios/"+uid));

if(snap.exists() && snap.val().voted){
alert("Ya votaste");
return;
}

await set(ref(db,"usuarios/"+uid),{
voted:true,
vote:option,
date:Date.now()
});

const voteSnap = await get(votesRef);
let votes = voteSnap.val() || {};

votes[option] = (votes[option]||0)+1;

await set(votesRef,votes);

alert("Voto registrado");
};

// ================= COMENTARIOS =================
window.sendComment = async function(){

const text = document.getElementById("comment").value;

if(!text){
alert("Escribe un comentario");
return;
}

await push(commentsRef,{
user:uid,
text:text,
date:Date.now()
});

document.getElementById("comment").value = "";
alert("Comentario enviado");
};

</script>

</body>
</html>
