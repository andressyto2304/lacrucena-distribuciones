<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votación Segura</title>

<style>
body{
font-family:Arial;
background:#000;
color:#fff;
padding:20px;
}

.card{
max-width:800px;
margin:auto;
background:#111;
padding:20px;
border-radius:15px;
}

button{
padding:10px;
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
background:#00cc44;
color:white;
font-weight:bold;
cursor:pointer;
}

img{
width:100%;
border-radius:10px;
}

.section{
margin-top:20px;
padding:15px;
border:1px solid #333;
border-radius:10px;
}

/* ADMIN */
#adminPanel{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
overflow:auto;
padding:20px;
z-index:9999;
}
</style>

</head>

<body>

<div class="card">

<h1>🗳️ Votación Segura</h1>

<div id="status"></div>

<div class="section">
<h2>🥤 Gaseosas</h2>

<button onclick="vote('g1')">Gaseosa 1</button>
<button onclick="vote('g2')">Gaseosa 2</button>
<button onclick="vote('g3')">Gaseosa 3</button>

</div>

<div class="section">
<h2>🧃 Jugos</h2>

<button onclick="vote('j1')">Jugo 1</button>
<button onclick="vote('j2')">Jugo 2</button>
<button onclick="vote('j3')">Jugo 3</button>

</div>

</div>

<!-- ADMIN -->
<div id="adminPanel">

<h1>🔐 ADMIN PANEL</h1>

<h3>👥 Usuarios registrados</h3>
<div id="userList"></div>

<button onclick="document.getElementById('adminPanel').style.display='none'">
Cerrar
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const usersRef = ref(db,"usuarios");
const votesRef = ref(db,"votos");

// =============================
// 1. GENERAR ID ÚNICO
// =============================
function getUserId(){
let id = localStorage.getItem("uid");
if(!id){
id = "U_" + Math.random().toString(36).substring(2,12);
localStorage.setItem("uid",id);
}
return id;
}

const uid = getUserId();

// =============================
// 2. VERIFICAR SI YA VOTÓ
// =============================
let userData = null;

onValue(usersRef,(snap)=>{
userData = snap.val() || {};
if(userData[uid]?.voted){
document.getElementById("status").innerHTML =
"⚠️ Ya has votado anteriormente";
}
});

// =============================
// 3. VOTAR
// =============================
window.vote = async function(option){

// bloqueo real
const snap = await get(ref(db,"usuarios/"+uid));

if(snap.exists() && snap.val().voted){
alert("Ya votaste, acceso bloqueado");
return;
}

// guardar usuario
await set(ref(db,"usuarios/"+uid),{
voted:true,
vote:option,
date:Date.now()
});

// guardar voto global
const voteSnap = await get(votesRef);
let votes = voteSnap.val() || {};

votes[option] = (votes[option]||0)+1;

await set(votesRef,votes);

alert("✅ Voto registrado correctamente");

};

// =============================
// 4. ADMIN PANEL
// =============================
const url = new URLSearchParams(window.location.search);

if(url.get("admin")==="CRUCENA2026"){
document.getElementById("adminPanel").style.display="block";

onValue(usersRef,(snap)=>{

const data = snap.val() || {};
let html = "";

Object.keys(data).forEach(k=>{
html += `
<div style="border-bottom:1px solid #333;padding:10px">
<p><b>ID:</b> ${k}</p>
<p><b>Voto:</b> ${data[k].vote}</p>

<button onclick="deleteUser('${k}')">Eliminar bloqueo</button>
</div>
`;
});

document.getElementById("userList").innerHTML = html;

});

}

// eliminar usuario
window.deleteUser = async function(id){
await remove(ref(db,"usuarios/"+id));
alert("Usuario desbloqueado");
};

</script>

</body>

</html>
