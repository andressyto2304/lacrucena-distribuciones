<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votación Etiquetas</title>

<style>
body{
font-family:Arial;
background:#000;
color:#fff;
padding:20px;
}

.card{
max-width:750px;
margin:auto;
background:#111;
padding:20px;
border-radius:15px;
}

.section{
margin-top:20px;
padding:15px;
border:1px solid #333;
border-radius:10px;
}

.package{
margin-top:10px;
padding:10px;
border:1px solid #00cc44;
border-radius:10px;
text-align:center;
}

button{
padding:10px;
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
background:#00cc44;
color:white;
font-weight:bold;
cursor:pointer;
}

img{
width:100%;
border-radius:10px;
}

.bar{
width:100%;
height:15px;
background:#222;
border-radius:10px;
overflow:hidden;
margin-top:5px;
}

.fill{
height:100%;
background:#00cc44;
width:0%;
}

small{
display:block;
text-align:center;
margin-top:5px;
}
</style>

</head>

<body>

<div class="card">

<h1 style="text-align:center;">🗳️ Votación de Etiquetas</h1>

<!-- GASEOSAS -->
<div class="section">
<h2>🥤 Gaseosas</h2>

<div class="package">
<img src="gaseosa1.png">
<button onclick="vote('g1','gaseosa')">Votar</button>
<div class="bar"><div id="bar_g1" class="fill"></div></div>
<small id="p_g1">0%</small>
</div>

<div class="package">
<img src="gaseosa2.png">
<button onclick="vote('g2','gaseosa')">Votar</button>
<div class="bar"><div id="bar_g2" class="fill"></div></div>
<small id="p_g2">0%</small>
</div>

<div class="package">
<img src="gaseosa3.png">
<button onclick="vote('g3','gaseosa')">Votar</button>
<div class="bar"><div id="bar_g3" class="fill"></div></div>
<small id="p_g3">0%</small>
</div>
</div>

<!-- JUGOS -->
<div class="section">
<h2>🧃 Jugos</h2>

<div class="package">
<img src="jugo1.png">
<button onclick="vote('j1','jugo')">Votar</button>
<div class="bar"><div id="bar_j1" class="fill"></div></div>
<small id="p_j1">0%</small>
</div>

<div class="package">
<img src="jugo2.png">
<button onclick="vote('j2','jugo')">Votar</button>
<div class="bar"><div id="bar_j2" class="fill"></div></div>
<small id="p_j2">0%</small>
</div>

<div class="package">
<img src="jugo3.png">
<button onclick="vote('j3','jugo')">Votar</button>
<div class="bar"><div id="bar_j3" class="fill"></div></div>
<small id="p_j3">0%</small>
</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const refVotos = ref(db, "votos");

let votos = {
  g1:0,g2:0,g3:0,
  j1:0,j2:0,j3:0
};

// bloqueo por categoría
let userVote = JSON.parse(localStorage.getItem("userVote") || "{}");

onValue(refVotos,(snap)=>{

const data = snap.val();
if(data){
votos = data;

updateUI();
}

});

window.vote = async function(id, cat){

if(userVote[cat]){
alert("Ya votaste en esta categoría");
return;
}

userVote[cat] = id;
localStorage.setItem("userVote", JSON.stringify(userVote));

votos[id] = (votos[id]||0)+1;

await set(refVotos, votos);

updateUI();
}

function updateUI(){

// GASEOSAS
updateGroup(["g1","g2","g3"]);

// JUGOS
updateGroup(["j1","j2","j3"]);

}

function updateGroup(arr){

let total = 0;

arr.forEach(i=>{
total += (votos[i]||0);
});

arr.forEach(i=>{

let p = total>0 ? (votos[i]/total)*100 : 0;

document.getElementById("p_"+i).innerText = p.toFixed(1)+"%";
document.getElementById("bar_"+i).style.width = p+"%";

});

}

</script>

</body>
</html>
