<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votación de Etiquetas</title>

<style>
body{
font-family:Arial;
background:#000;
color:#fff;
padding:20px;
}

.card{
max-width:750px;
margin:auto;
background:#111;
padding:20px;
border-radius:15px;
}

.section{
margin-top:20px;
padding:15px;
border:1px solid #333;
border-radius:10px;
}

.package{
margin-top:10px;
padding:10px;
border:1px solid #00cc44;
border-radius:10px;
text-align:center;
}

button{
padding:10px;
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
background:#00cc44;
color:white;
font-weight:bold;
cursor:pointer;
}

img{
width:100%;
border-radius:10px;
display:block;
}

p{
text-align:center;
}

h2{
text-align:center;
}
</style>

</head>

<body>

<div class="card">

<h1 style="text-align:center;">🗳️ Votación de Etiquetas</h1>

<!-- ================= GASEOSAS ================= -->
<div class="section">
<h2>🥤 Gaseosas</h2>

<div class="package">
<img src="gaseosa1.png?v=3" onerror="this.src='https://via.placeholder.com/300x200?text=Gaseosa+1'">
<button onclick="vote('g1')">Votar Gaseosa 1</button>
<p>Votos: <span id="g1">0</span></p>
</div>

<div class="package">
<img src="gaseosa2.jpg?v=3" onerror="this.src='https://via.placeholder.com/300x200?text=Gaseosa+2'">
<button onclick="vote('g2')">Votar Gaseosa 2</button>
<p>Votos: <span id="g2">0</span></p>
</div>

<div class="package">
<img src="gaseosa3.png?v=3" onerror="this.src='https://via.placeholder.com/300x200?text=Gaseosa+3'">
<button onclick="vote('g3')">Votar Gaseosa 3</button>
<p>Votos: <span id="g3">0</span></p>
</div>

</div>

<!-- ================= JUGOS ================= -->
<div class="section">
<h2>🧃 Jugos</h2>

<div class="package">
<img src="jugo1.png?v=3" onerror="this.src='https://via.placeholder.com/300x200?text=Jugo+1'">
<button onclick="vote('jugo1')">Votar Jugo 1</button>
<p>Votos: <span id="jugo1">0</span></p>
</div>

<div class="package">
<img src="jugo2.png?v=3" onerror="this.src='https://via.placeholder.com/300x200?text=Jugo+2'">
<button onclick="vote('jugo2')">Votar Jugo 2</button>
<p>Votos: <span id="jugo2">0</span></p>
</div>

<div class="package">
<img src="jugo3.png?v=3" onerror="this.src='https://via.placeholder.com/300x200?text=Jugo+3'">
<button onclick="vote('jugo3')">Votar Jugo 3</button>
<p>Votos: <span id="jugo3">0</span></p>
</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const votosRef = ref(db, "votos");

let votos = {
  g1:0,g2:0,g3:0,
  jugo1:0,jugo2:0,jugo3:0
};

let voted = {};

onValue(votosRef,(snap)=>{

const data = snap.val() || {};
votos = data;

Object.keys(votos).forEach(k=>{
const el = document.getElementById(k);
if(el) el.innerText = votos[k] || 0;
});

});

window.vote = async function(id){

if(voted[id]){
alert("Ya votaste esta opción");
return;
}

voted[id] = true;

votos[id] = (votos[id]||0)+1;

const el = document.getElementById(id);
if(el) el.innerText = votos[id];

await set(votosRef, votos);

};

</script>

</body>
</html>
