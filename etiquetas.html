<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votación de Etiquetas</title>

<style>
body{
font-family:Arial;
background:#000;
color:#fff;
padding:20px;
}

.card{
max-width:800px;
margin:auto;
background:#111;
padding:20px;
border-radius:15px;
}

.section{
margin-top:20px;
padding:15px;
border:1px solid #333;
border-radius:10px;
}

button{
padding:10px;
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
background:#00cc44;
color:white;
font-weight:bold;
cursor:pointer;
}

/* ✔ IMAGENES UNIFORMES */
img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
margin-top:10px;
}

.progressBar{
height:8px;
background:#222;
border-radius:5px;
overflow:hidden;
margin-top:5px;
}

.progress{
height:100%;
background:#00cc44;
width:0%;
}

#nextBtn{
display:none;
margin-top:20px;
background:#007bff;
}
</style>

</head>

<body>

<div class="card">

<h1>🗳️ Votación de Etiquetas</h1>

<!-- GASEOSAS -->
<div class="section">
<h2>🥤 Gaseosas</h2>

<img src="gaseosa 1.png">
<button onclick="vote('gaseosa','g1')">Gaseosa 1</button>

<img src="gaseosa 2.jpg">
<button onclick="vote('gaseosa','g2')">Gaseosa 2</button>

<img src="gaseosa 3.png">
<button onclick="vote('gaseosa','g3')">Gaseosa 3</button>

</div>

<!-- JUGOS -->
<div class="section">
<h2>🧃 Jugos</h2>

<img src="jugo 1.png">
<button onclick="vote('jugo','j1')">Jugo 1</button>

<img src="jugo 2.png">
<button onclick="vote('jugo','j2')">Jugo 2</button>

<img src="jugo 3.png">
<button onclick="vote('jugo','j3')">Jugo 3</button>

</div>

<!-- BOTÓN MANUAL -->
<button id="nextBtn" onclick="goNext()">
➡ Ir a Paquetes Promocionales
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zC8C8C8C8",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const votosRef = ref(db,"votos");

function getUserId(){
let id = localStorage.getItem("uid");
if(!id){
id = "U_" + Math.random().toString(36).substring(2,12);
localStorage.setItem("uid",id);
}
return id;
}

const uid = getUserId();

// estado local
let votedGaseosa = false;
let votedJugo = false;

// VOTAR
window.vote = async function(cat,opt){

const userRef = ref(db,"usuarios/"+uid);
const snap = await get(userRef);
const data = snap.val()||{};

// bloqueo por categoría
if(cat==="gaseosa" && data.gaseosaVotado){
alert("Ya votaste gaseosas");
return;
}

if(cat==="jugo" && data.jugoVotado){
alert("Ya votaste jugos");
return;
}

// guardar usuario
if(cat==="gaseosa"){
await set(userRef,{...data,gaseosaVotado:true,gaseosa:opt});
votedGaseosa = true;
}

if(cat==="jugo"){
await set(userRef,{...data,jugoVotado:true,jugo:opt});
votedJugo = true;
}

// votos global
const votosSnap = await get(votosRef);
let votos = votosSnap.val()||{};

votos[opt]=(votos[opt]||0)+1;

await set(votosRef,votos);

// verificar final
checkFinish();
};

function checkFinish(){

if(votedGaseosa && votedJugo){

document.getElementById("nextBtn").style.display="block";

setTimeout(()=>{
alert("🎉 Gracias por participar");
window.location.href="paquetes.html";
},1500);

}
}

// fallback manual
window.goNext = function(){
window.location.href="paquetes.html";
};

</script>

</body>
</html>
