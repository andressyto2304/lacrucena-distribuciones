<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votación de Etiquetas</title>

<style>
body{
font-family:Arial;
background:#000;
color:#fff;
padding:20px;
}

.card{
max-width:800px;
margin:auto;
background:#111;
padding:20px;
border-radius:15px;
}

.section{
margin-top:20px;
padding:15px;
border:1px solid #333;
border-radius:10px;
}

button{
padding:10px;
width:100%;
margin-top:10px;
border:none;
border-radius:8px;
background:#00cc44;
color:white;
font-weight:bold;
cursor:pointer;
}

img{
width:100%;
border-radius:10px;
display:block;
}
</style>

</head>

<body>

<div class="card">

<h1>🗳️ Votación de Etiquetas</h1>

<!-- GASEOSAS -->
<div class="section">
<h2>🥤 Gaseosas</h2>

<img src="gaseosa 1.png" onerror="this.src='gaseosa1.png'">
<button onclick="vote('g1')">Votar Gaseosa 1</button>

<img src="gaseosa 2.jpg" onerror="this.src='gaseosa2.jpg'">
<button onclick="vote('g2')">Votar Gaseosa 2</button>

<img src="gaseosa 3.png" onerror="this.src='gaseosa3.png'">
<button onclick="vote('g3')">Votar Gaseosa 3</button>

</div>

<!-- JUGOS -->
<div class="section">
<h2>🧃 Jugos</h2>

<img src="jugo 1.png" onerror="this.src='jugo1.png'">
<button onclick="vote('jugo1')">Votar Jugo 1</button>

<img src="jugo 2.png" onerror="this.src='jugo2.png'">
<button onclick="vote('jugo2')">Votar Jugo 2</button>

<img src="jugo 3.png" onerror="this.src='jugo3.png'">
<button onclick="vote('jugo3')">Votar Jugo 3</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzKqIZC8Jg4zqwxTwMN0OgfmE-xLKmHHc",
  authDomain: "lacrucena-db.firebaseapp.com",
  databaseURL: "https://lacrucena-db-default-rtdb.firebaseio.com",
  projectId: "lacrucena-db",
  storageBucket: "lacrucena-db.firebasestorage.app",
  messagingSenderId: "808407017494",
  appId: "1:808407017494:web:3202e7a9ee67e8d625ed37"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const votosRef = ref(db,"votos");

function getUserId(){
let id = localStorage.getItem("uid");
if(!id){
id = "U_" + Math.random().toString(36).substring(2,12);
localStorage.setItem("uid",id);
}
return id;
}

const uid = getUserId();

window.vote = async function(option){

const snap = await get(votosRef);
let votos = snap.val() || {};

votos[option] = (votos[option]||0)+1;

await set(votosRef,votos);

alert("Voto registrado");

};

</script>

</body>
</html>
